services:
  webportal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webportal
    ports:
      - "80:80"
    volumes:
      - webportal-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + process.env.PORT, (r) => { if (r.statusCode !== 200) process.exit(1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  webportal-data:
