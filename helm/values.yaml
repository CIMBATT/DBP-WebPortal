image:
  repository: tnode.azurecr.io/cimbatt/webportal
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: webportal.cimbatt.digital-passport.org
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: webportal.cimbatt.digital-passport.org-tls
      hosts:
        - webportal.cimbatt.digital-passport.org


persistence:
  enabled: true
  existingClaim: ""
  # Empty uses the cluster's default StorageClass; "-" disables dynamic provisioning.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
